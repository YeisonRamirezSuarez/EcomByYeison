<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión</title>
    <style>
      :root {
        --emerald: #063c28;
        --emerald-light: #3b9c3c;
        --bg: #fcf0e4;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--emerald);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 420px; }
      h1 { font-size: 22px; margin: 24px 0 8px; }
      p { font-size: 15px; line-height: 1.5; opacity: 0.8; margin: 0 0 24px; }
      button {
        background: var(--emerald);
        color: #fff;
        border: 0;
        border-radius: 9999px;
        padding: 12px 28px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #063d29; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Estás sin conexión</h1>
      <p>
        No pudimos cargar la página. Revisa tu conexión a internet e inténtalo
        de nuevo.
      </p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
